<title>cashbook</title>
<style>
[hidden]{display:none!important}
/* Layout: one RTL column. A ruled-notebook hero carries the remaining balance; five-tab bar pinned to the bottom. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F2F2F2; --ink:#000000; --muted:#595959;
  --line:#CFCFCF; --accent:#000000; --accent-ink:#FFFFFF; --accent-soft:#E6E6E6;
  --warn:#000000; --warn-soft:#EDEDED; --bad:#000000; --bad-soft:#E0E0E0;
  --needs:#000000; --wants:#6B6B6B; --save:#A6A6A6; --free:#DADADA;
  --rule:#EDEDED; --margin:#9A9A9A; --scrim:rgba(0,0,0,.5); --money:#12803A; --c-red:#D92D20; --c-blue:#1D5FD0;
  --f-display:'DM Sans','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'DM Sans','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0B0B0B; --surface2:#1A1A1A; --ink:#FFFFFF; --muted:#A6A6A6;
  --line:#363636; --accent:#FFFFFF; --accent-ink:#000000; --accent-soft:#2A2A2A;
  --warn:#FFFFFF; --warn-soft:#262626; --bad:#FFFFFF; --bad-soft:#333333;
  --needs:#FFFFFF; --wants:#9A9A9A; --save:#5E5E5E; --free:#2B2B2B;
  --rule:#171717; --margin:#666666; --scrim:rgba(0,0,0,.7); --money:#4ADE80; --c-red:#F0443A; --c-blue:#4A8CF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0B0B0B; --surface2:#1A1A1A; --ink:#FFFFFF; --muted:#A6A6A6;
  --line:#363636; --accent:#FFFFFF; --accent-ink:#000000; --accent-soft:#2A2A2A;
  --warn:#FFFFFF; --warn-soft:#262626; --bad:#FFFFFF; --bad-soft:#333333;
  --needs:#FFFFFF; --wants:#9A9A9A; --save:#5E5E5E; --free:#2B2B2B;
  --rule:#171717; --margin:#666666; --scrim:rgba(0,0,0,.7); --money:#4ADE80; --c-red:#F0443A; --c-blue:#4A8CF0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px}
body{background:var(--bg);color:var(--ink);font:500 16px/1.6 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:720px;margin-inline:auto;padding-inline:16px;padding-block:0 112px}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;font-weight:600}
.u{font-size:.78em;color:var(--muted);font-weight:500}
.n.m{color:var(--money)!important}
#salary,#extra,#qAmount,#f_amount,#cLim,.catedit .ce-lim{color:var(--money);font-weight:600}

.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding-block:max(8px,env(safe-area-inset-top)) 6px;background:var(--bg)}
.ptitle{margin:0;font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.3}
.dotsbtn{width:44px;height:44px;margin-inline-end:-10px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.dotsbtn:hover,.dotsbtn[aria-expanded="true"]{background:var(--surface2)}
.dotsbtn svg{width:22px;height:22px}
.menu{position:absolute;inset-inline-end:0;top:calc(100% - 6px);min-width:220px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:16}
.menu[hidden]{display:none}
.menu .mi{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 12px;border-radius:10px;font-weight:600;font-size:.9375rem;text-align:start}
.menu .mi:hover{background:var(--surface2)}
.menu .mi svg{width:20px;height:20px;flex:none;color:var(--muted)}
.tl{display:flex;align-items:center;gap:2px;min-width:0}
.tl .pdr-back{margin-inline-start:-10px}
.tl .pdr-back[hidden]{display:none}
.menu .mh{padding:8px 12px 4px;font-size:0.75rem;font-weight:600;color:var(--muted)}
.menu .mi .switch{margin-inline-start:auto;width:42px;height:26px;border-radius:13px;pointer-events:none}
.menu .mi .switch::after{width:22px;height:22px;top:2px;inset-inline-start:2px}
.menu .mi .switch[aria-checked="true"]::after{inset-inline-start:18px}
.topr{display:flex;align-items:center;gap:10px;min-width:0}
.themebtn{min-width:34px;width:34px;padding:0;display:grid;place-items:center}
.themebtn svg{width:18px;height:18px}
.langbtn{min-height:34px;min-width:52px;padding:2px 14px;border:1.5px solid var(--ink);border-radius:17px;font-weight:700;font-size:0.8125rem;text-align:center;background:var(--surface)}
body.gated .app,body.gated .tabs,body.gated .scrim{display:none}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.gate[hidden]{display:none}
.gspin{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:gsp .7s linear infinite}
@keyframes gsp{to{transform:rotate(360deg)}}
.avw{position:relative;width:104px;height:104px;border-radius:50%;margin-bottom:8px}
.av2{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:2.5rem;font-weight:700;box-shadow:0 0 0 5px var(--bg),0 0 0 6.5px var(--line)}
.av2.off{background:var(--surface2);color:var(--muted)}
.av2 svg{width:46px;height:46px}
.sdot{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;background:var(--money);border:4px solid var(--bg);box-sizing:border-box}
.sdot.ok{animation:gpulse 2.4s ease-out infinite}
.sdot.busy{background:var(--muted);animation:gblink 1s ease-in-out infinite}
.sdot.bad{background:var(--c-red)}
.sdot.off{background:var(--muted)}
@keyframes gblink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.sdot{animation:none!important}}
.hs{color:var(--muted);font-size:0.875rem}
.hs.ok{color:var(--money)}
.hs.bad{color:var(--c-red)}
.sgrp{padding:0;overflow:hidden}
.sg-row{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:10px 16px;text-align:start}
.sg-row+.sg-row{border-top:1px solid var(--line)}
.sg-row:hover{background:var(--surface2)}
.sg-i{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--ink)}
.sg-i svg{width:18px;height:18px}
.sg-t{display:grid;gap:2px;min-width:0}
.sg-t b{font-size:0.9688rem;font-weight:600}
.sg-t small{color:var(--muted);font-size:0.8125rem}
.sg-row.bad .sg-t b{color:var(--c-red)}
.sg-row.bad .sg-i{color:var(--c-red)}
.dataps{border-top:0;padding-top:0}

/* header profile pill */
.pav{position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.pav img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.pav svg{width:18px;height:18px}
.pav .sdot{width:11px;height:11px;border-width:2px;right:-2px;bottom:-2px}
.av2 img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
/* profile page */
body.gated .pdr{display:none}
body.pdr-open{overflow:hidden}
.pdr{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pdr[hidden]{display:none}
:root[dir="ltr"] .pdr{animation-name:pin-r}
@keyframes pin-l{from{transform:translateX(-100%)}to{transform:none}}
@keyframes pin-r{from{transform:translateX(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.pdr{animation:none}}
.pdr-p{max-width:720px;width:calc(100% - 16px);margin:0 auto;padding:8px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.pdr-p .pdr-h{margin-top:max(10px,env(safe-area-inset-top))}
body.pdr-open .tabs{z-index:61}
.pdr-h{display:flex;align-items:center;gap:6px;min-height:52px}
.pdr-h h2{margin:0;font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.pdr-back{width:44px;height:44px;margin-inline-start:-10px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.pdr-back:hover{background:var(--surface2)}
.pdr-back svg{width:24px;height:24px}
:root[dir="rtl"] .pdr-back svg{transform:scaleX(-1)}
.pdr-av{display:grid;justify-items:center;gap:8px;margin:14px 0 22px;width:100%;text-align:center}
button.pdr-av{cursor:pointer}
.pdr-nm{font-family:var(--f-display);font-size:1.375rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdr-nm.ph{color:var(--muted);font-weight:600}
button.pdr-nm{padding:4px 12px;border-radius:10px;min-height:40px}
button.pdr-nm:hover{background:var(--surface2)}
.pdr .field{margin-top:14px}
.pdr-save{width:100%;margin-top:18px}
.pmsg{margin:12px 6px 0;font-size:.875rem}
.pmsg.ok{color:var(--money)}
.pmsg.bad{color:var(--c-red)}
.pdr-av .avw{width:104px;height:104px;margin:0;padding:0;display:block}
.pdr-av .av2{font-size:1rem;box-shadow:0 0 0 1px var(--line)}
.cam{position:absolute;inset-inline-end:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:3px solid var(--bg)}
.cam svg{width:16px;height:16px}
.pname{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:2px 10px;border-radius:10px;font-family:var(--f-display);font-size:1.375rem;font-weight:700;max-width:100%}
.pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pname.ph span{color:var(--muted);font-weight:600}
.pname svg{width:16px;height:16px;color:var(--muted);flex:none}
.pname:hover{background:var(--surface2)}
.pname-in{width:min(280px,100%);height:44px;border:1px solid var(--ink);border-radius:12px;background:var(--surface2);color:var(--ink);text-align:center;font-family:var(--f-display);font-size:1.25rem;font-weight:700;padding-inline:12px}
.pname-in:focus{outline:none}
.avv{position:fixed;inset:0;z-index:90;background:#000;color:#fff;display:flex;flex-direction:column}
.avv-h{display:flex;align-items:center;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 12px 0;min-height:56px}
.avv .pdr-back,.avv .dotsbtn{color:#fff}
.avv .dotsbtn{margin-inline-end:0}
.avv .pdr-back:hover,.avv .dotsbtn:hover,.avv .dotsbtn[aria-expanded="true"]{background:rgba(255,255,255,.14)}
.avv-menu{inset-inline-end:12px;top:max(54px,calc(env(safe-area-inset-top) + 44px));background:#1A1A1A;border-color:#363636;color:#fff}
.avv-menu .mi:hover{background:#2A2A2A}
.avv-menu .mi svg{color:#A6A6A6}
.avv-menu .mi.bad,.avv-menu .mi.bad svg{color:#F0443A}
.avv-img{flex:1;display:grid;place-items:center;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));min-height:0}
.avv-img img{display:block;width:100%;max-height:100%;object-fit:contain}
.pr-card{background:var(--surface2);border-radius:16px;overflow:hidden;margin-top:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pr-card{background:#000;border:1px solid var(--line)}}
:root[data-theme="dark"] .pr-card{background:#000;border:1px solid var(--line)}
.pr-row{text-decoration:none;display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 16px;text-align:start;color:var(--ink)}
button.pr-row:hover,a.pr-row:hover{background:var(--accent-soft)}
.pr-row>svg{width:20px;height:20px;flex:none;color:var(--ink)}
.pr-t{flex:1;min-width:0;display:grid;gap:1px}
.pr-t b{font-size:0.9688rem;font-weight:600}
.pr-t small{color:var(--muted);font-size:0.8125rem;line-height:1.5}
.pr-t small.bad{color:var(--c-red)}
.pr-v{color:var(--muted);font-size:0.875rem;flex:none;font-variant-numeric:tabular-nums}
.pr-chv{width:18px!important;height:18px!important;color:var(--muted)!important;flex:none}
:root[dir="rtl"] .pr-chv{transform:scaleX(-1)}
.pr-row.bad,.pr-row.bad>svg,.pr-row.bad .pr-t b{color:var(--c-red)}
.pr-row .switch{pointer-events:none}
.stdot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--muted)}
.stdot.ok{background:var(--money);animation:gpulse 2.4s ease-out infinite}
.stdot.busy{animation:gblink 1s ease-in-out infinite}
.stdot.bad{background:var(--c-red)}
.pdr .banner{margin:14px 0 0}
.pdr .hint,.pdr .bkmsg{margin:10px 6px 0}
.pfoot{margin:22px 6px 0;font-size:0.8125rem}
.pfoot a{color:var(--muted);text-decoration:underline}
.pfoot{margin:22px 4px 0;font-size:0.8125rem}
.pfoot a{color:var(--muted);text-decoration:underline}
/* this month card */
.mon{padding:14px 16px 12px}
.mon-hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mon-k{display:block;color:var(--muted);font-size:0.75rem;font-weight:600}
.mon-n{margin-top:2px}
.mon-n .n.m{font-size:2rem;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.mon-ring{position:relative;width:56px;height:56px;flex:none}
.mon-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mon-ring circle{fill:none;stroke-width:5}
.mon-ring .bg{stroke:var(--free)}
.mon-ring .fg{stroke:var(--ink);stroke-linecap:round}
.mon-ring.over .fg{stroke:var(--c-red)}
.mon-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:0.75rem;font-weight:700;font-variant-numeric:tabular-nums}
.mon-bar{display:flex;gap:2px;height:10px;margin-top:12px;border-radius:6px;overflow:hidden}
.mon-bar i{display:block;background:var(--ink);min-width:3px}
.mon-leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:0.75rem;color:var(--muted)}
.mon-leg span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.mon-leg i{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}
.mon-leg b{color:var(--ink);font-weight:700}
.mon-st{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.mon-st>div{display:grid;gap:1px;align-content:start;padding-inline:10px;min-width:0}
.mon-st>div:first-child{padding-inline-start:0}
.mon-st>div+div{border-inline-start:1px solid var(--line)}
.mon-st span{color:var(--muted);font-size:0.6875rem}
.mon-st .n.m{font-size:0.9688rem;font-weight:700}
.mon-st small{color:var(--muted);font-size:0.6875rem}
/* sign-in (modern, filled fields) */
.lg{box-sizing:border-box;min-height:100%;max-width:440px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
@keyframes lgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lg{animation:none}}
#splash{position:fixed;inset:0;z-index:500;background:#000;display:grid;place-items:center;overflow:hidden;direction:ltr}
.sp-st{position:relative;width:min(21.8vw,96px)}
#spSvg{position:relative;display:block;width:100%;height:auto;overflow:visible}
#spSvg circle{transform-box:fill-box;transform-origin:center}
.sp-o{position:absolute;display:block;width:0;height:0;box-sizing:border-box;background:#4ADE80;border:0 solid #4ADE80;border-radius:999px;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2}
.sp-hole{position:absolute;display:block;width:0;height:0;border-radius:999px;left:50%;top:50%;box-shadow:0 0 0 200vmax #000;transform:translate(-50%,-50%);opacity:0}
.lg3{height:100%;min-height:0;padding-inline:0;gap:0}
.lg3 .lg-top{padding-inline:22px}
.lg-brand svg{display:block;height:46px;width:auto}
.lg-brand{font-family:'DM Sans',system-ui,sans-serif;font-size:1.5rem;font-weight:500;letter-spacing:-.03em;direction:ltr}
.ob{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;outline:none}
.ob::-webkit-scrollbar{display:none}
.ob-s{flex:0 0 100%;box-sizing:border-box;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;padding:0 26px;overflow-y:auto}
.ob-s h2{margin:22px 0 0;font-size:1.75rem;line-height:1.3;font-weight:800;text-wrap:balance}
.ob-s p{margin:10px 0 0;color:var(--muted);font-size:.9688rem;line-height:1.7;max-width:34ch}
.ob-v{position:relative;display:grid;place-items:center;height:290px}
.ob-v::before{content:"";position:absolute;inset:-10px -26px;background:radial-gradient(55% 55% at 50% 45%,rgba(128,128,128,.22),transparent 72%),radial-gradient(40% 35% at 20% 85%,rgba(74,222,128,.10),transparent 70%);pointer-events:none}
.ob-v::after{content:"";position:absolute;inset:-10px -26px;background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:18px 18px;-webkit-mask-image:radial-gradient(60% 60% at 50% 50%,#000,transparent 80%);mask-image:radial-gradient(60% 60% at 50% 50%,#000,transparent 80%);opacity:.8;pointer-events:none}
.obc{position:relative;z-index:1;width:100%;max-width:330px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 16px 36px rgba(0,0,0,.3)}
.obc small{display:block;color:var(--muted);font-size:.75rem}
.obn{margin:2px 0 12px;font-size:2.125rem;font-weight:700;line-height:1.2;color:var(--money)}
.obc .alloc{margin:0 0 6px;height:10px;border-radius:5px}
.obr{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:.9375rem}
.obr:first-child{border-top:0}
.obc .alloc+.obr{margin-top:6px}
.obr b{flex:1;font-weight:600}
.obr .n{font-weight:700}
.obt{flex:1;min-width:0}
.obt b{display:block;font-weight:600}
.obk{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;box-sizing:border-box}
.obk.ok{background:var(--money);border-color:var(--money);color:#000}
.obk svg{width:15px;height:15px}
.obr .switch{pointer-events:none}
.obr .switch.on{background:var(--money)}
.obr .switch.on::after{inset-inline-start:22px}
.obl{display:flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--muted);margin-bottom:10px}
.obl .obq{width:14px;height:0;border-top:2.5px solid;flex:none}
.obl .obq.r{border-color:var(--c-red)}
.obl .obq.d{border-top-style:dashed;border-color:var(--margin);margin-inline-start:10px}
.obg{display:block;width:100%;height:130px;overflow:visible}
.obg .bud{stroke:var(--margin);stroke-width:1.4;stroke-dasharray:5 5}

function readAvatar(file){
  if(!file)return;
  var bad=function(){U.avMsg=true;renderProf();};
  U.avMsg=false;
  if(!/^image\//.test(file.type||"")||file.size>15*1024*1024)return bad();
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      try{
        var w=im.naturalWidth,hh=im.naturalHeight,sq=Math.min(w,hh),z=256,cv=document.createElement("canvas");
        if(!sq)return bad();
        cv.width=cv.height=z;
        var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,z,z);
        cx.drawImage(im,(w-sq)/2,(hh-sq)/2,sq,sq,0,0,z,z);
        var u=cv.toDataURL("image/jpeg",0.82);
        if(!/^data:image\/jpeg;base64,/.test(u)||u.length>150000)return bad();
        S.avatar=u;U.avMsg=false;touch();paintProf();
      }catch(e){bad();}
    };
    im.onerror=bad;im.src=String(r.result);
  };
  r.onerror=bad;r.readAsDataURL(file);
}

/* ---------- calculations ---------- */
function calc(ym){
  var income=(+S.salary||0)+(+S.extra||0);
  var cats={};S.cats.forEach(function(c){cats[c.id]={fixed:0,subs:0,vari:0,total:0};});
  cats._none={fixed:0,subs:0,vari:0,total:0};
  var slot=function(id){return Object.prototype.hasOwnProperty.call(cats,id)&&id!=="_none"?cats[id]:cats._none;};
  S.bills.forEach(function(b){slot(b.cat).fixed+=b.amount;});
  S.subs.forEach(function(x){if(x.active)slot(x.cat).subs+=subMonthly(x);});
  (S.meters||[]).forEach(function(m){m.charges.forEach(function(c){if(c.date.slice(0,7)===ym)slot(m.cat).fixed+=c.amount;});});
  S.tx.forEach(function(x){if(x.date.slice(0,7)===ym)slot(x.cat).vari+=x.amount;});
  var spent=0;
  Object.keys(cats).forEach(function(k){var x=cats[k];x.total=x.fixed+x.subs+x.vari;spent+=x.total;});
  return {income:income,cats:cats,spent:spent,remaining:income-spent};
}

var CH=null;
function dailyParts(ym){
  var D=dim(ym),f=[],v=[],i;for(i=0;i<=D;i++){f.push(0);v.push(0);}
  S.bills.forEach(function(b){f[dueDay(b,ym)]+=b.amount;});
  (S.meters||[]).forEach(function(m){m.charges.forEach(function(c){if(c.date.slice(0,7)===ym)f[+c.date.slice(8,10)]+=c.amount;});});
  S.subs.forEach(function(x){if(x.active)f[Math.min(Math.max(1,x.day||1),D)]+=subMonthly(x);});
  S.tx.forEach(function(x){if(x.date.slice(0,7)===ym)v[+x.date.slice(8,10)]+=x.amount;});
  return {f:f,v:v};
}
function dailySeries(ym){
  var D=dim(ym),a=[],i;for(i=0;i<=D;i++)a.push(0);
  S.bills.forEach(function(b){a[dueDay(b,ym)]+=b.amount;});
  (S.meters||[]).forEach(function(m){m.charges.forEach(function(c){if(c.date.slice(0,7)===ym)a[+c.date.slice(8,10)]+=c.amount;});});
  S.subs.forEach(function(x){if(x.active)a[Math.min(Math.max(1,x.day||1),D)]+=subMonthly(x);});
  S.tx.forEach(function(x){if(x.date.slice(0,7)===ym)a[+x.date.slice(8,10)]+=x.amount;});
  return a;
}
function niceMax(v){
  if(!(v>0))return 1;
  var p=Math.pow(10,Math.floor(Math.log10(v))),m=[1,2,4,5,8,10];
  for(var i=0;i<m.length;i++){if(m[i]*p>=v-1e-9)return m[i]*p;}
  return 10*p;
}
function compact(v){
  if(v>=1000){var k=Math.round(v/100)/10;return (k%1===0?k.toFixed(0):k.toFixed(1))+"K";}
  return String(Math.round(v));
}

function spMatch(o){

function exportBackup(){
  var payload={app:"dafter-albeit",v:1,exportedAt:new Date().toISOString(),state:S};
  var txt=JSON.stringify(payload,null,1),name="dafter-backup-"+todayISO+".json";
  var done=function(){S.lastBackup=todayISO;touch();U.bkMsg={ok:true,t:t("bkDone")};render();};
  var fail=function(e){if(e&&e.code==="declined")return;U.bkMsg={ok:false,t:t("bkFail")};render();};
  var viaLink=function(){
    try{
      var bl=new Blob([txt],{type:"application/json"}),u=URL.createObjectURL(bl),a=document.createElement("a");
      a.href=u;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},4000);done();
    }catch(e){fail(e);}
  };
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(function(d){if(!d){viaLink();return;}d.save({filename:name,data:txt}).then(done,fail);},function(){viaLink();});
  }else viaLink();
}
function readBackup(file){
  if(!file)return;
  var bad=function(){U.bkPend=null;U.bkMsg={ok:false,t:t("bkBad")};render();};
  if(file.size>5*1024*1024)return bad();
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(String(r.result)),st=(o&&o.app==="dafter-albeit"&&o.state&&typeof o.state==="object")?o.state:null;
      if(!st||!Array.isArray(st.cats))return bad();
      var nz=normalize(st),at=String(o.exportedAt||"").slice(0,10);
      nz.lastBackup=/^\d{4}-\d{2}-\d{2}$/.test(at)?at:"";
      U.bkPend={st:nz};U.bkMsg=null;render();
    }catch(e){bad();}
  };
  r.onerror=bad;r.readAsText(file);
}

function saveMeter(form){
  var sh=U.sheet,fd=new FormData(form),err=$("#fErr"),it=findItem(sh);
  var type=PP_TYPES.indexOf(String(fd.get("type")))>=0?String(fd.get("type")):"electricity";
  var name=String(fd.get("name")||"").trim().slice(0,60),cat=String(fd.get("cat")||"");
  var tname=type==="custom"?String(fd.get("tname")||"").trim().slice(0,40):"";
  if(type==="custom"&&!tname){err.textContent=t("eName");return;}
  var da=parseNum(fd.get("defamt"));if(!(da>0))da=0;
  var wn=parseNum(fd.get("warn"));if(isNaN(wn))wn=3;wn=Math.round(wn);
  if(wn<0||wn>30){err.textContent=t("eWarn");return;}
  if(it){it.type=type;it.typeName=tname;it.name=name;it.cat=cat;it.defAmt=da;it.warn=wn;}
  else{
    var m={id:uid(),type:type,typeName:tname,name:name,cat:cat,defAmt:da,warn:wn,charges:[]};
    var amt=parseNum(fd.get("amount")),date=String(fd.get("date")||"");
    if(amt>0){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){err.textContent=t("eDate");return;}
      m.charges.push({id:uid(),date:date,amount:amt});
    }
    if(!S.meters)S.meters=[];
    S.meters.push(m);
  }
  touch();closeSheet();render();
}

  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){err.textContent=t("eDate");return;}
  var c=sh.cid?m.charges.filter(function(x){return x.id===sh.cid;})[0]:null;

function saveSheet(form){
  if(U.sheet.kind==="income")return saveIncome(form);
  if(U.sheet.kind==="meter")return saveMeter(form);
  if(U.sheet.kind==="charge")return saveCharge(form);
  var sh=U.sheet,fd=new FormData(form),err=$("#fErr");
  var fail=function(m){err.textContent=m;};
  var amount=parseNum(fd.get("amount"));
  if(!(amount>0))return fail(t("eAmount"));
  var it=findItem(sh);
  if(sh.kind==="bill"||sh.kind==="sub"){
    var name=String(fd.get("name")||"").trim();
    if(!name)return fail(t("eName"));
    var day=parseNum(fd.get("day"));if(isNaN(day))day=1;
    if(day<1||day>31||Math.floor(day)!==day)return fail(t("eDay"));
    var renamed=!it||name!==nm(it);
    if(sh.kind==="bill"){
      if(it){if(renamed){it.name=name;it.sk="";}it.amount=amount;it.day=day;it.cat=String(fd.get("cat")||"");}
      else S.bills.push({id:uid(),sk:"",name:name,amount:amount,day:day,cat:String(fd.get("cat")||""),paid:{}});
    }else{
      var cy=fd.get("cycle")==="yearly"?"yearly":"monthly";
      if(it){if(renamed){it.name=name;it.sk="";}it.amount=amount;it.cycle=cy;it.day=day;it.cat=String(fd.get("cat")||"");}
      else S.subs.push({id:uid(),sk:"",name:name,cat:String(fd.get("cat")||""),amount:amount,cycle:cy,day:day,active:true,paid:{}});
    }
  }else{
    var date=String(fd.get("date")||"");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return fail(t("eDate"));
    var note=String(fd.get("note")||"").trim();
    var pc=resolveTxCat(fd);if(pc.err)return fail(pc.err);
    if(it){
      it.amount=amount;it.cat=pc.id;it.sk=pc.sk;it.date=date;
      it.memo=String(fd.get("memo")||"").trim().slice(0,200);
    }else S.tx.push({id:uid(),sk:pc.sk,amount:amount,cat:pc.id,note:note,memo:String(fd.get("memo")||"").trim().slice(0,200),date:date});
    U.ym=date.slice(0,7);
  }
  touch();closeSheet();render();
}
function deleteSheetItem(){
  var sh=U.sheet,keep=function(x){return x.id!==sh.id;};
  if(sh.kind==="charge"){var cm=meterById(sh.id);if(cm)cm.charges=cm.charges.filter(function(c){return c.id!==sh.cid;});}
  else if(sh.kind==="meter")S.meters=(S.meters||[]).filter(keep);
  else if(sh.kind==="bill")S.bills=S.bills.filter(keep);
  else if(sh.kind==="sub")S.subs=S.subs.filter(keep);
  else S.tx=S.tx.filter(keep);
  touch();closeSheet();render();
}

  var tt=document.createElement("div");tt.className="tt";tt.textContent=title;tipEl.appendChild(tt);
  rows.forEach(function(r){
    var d=document.createElement("div");d.className="tr";
    var l=document.createElement("span");l.textContent=r[0];
    var v=document.createElement("span");v.className="n m";v.textContent=n(r[1]);
    d.appendChild(l);d.appendChild(v);tipEl.appendChild(d);
  });
  tipEl.hidden=false;
  var w=tipEl.offsetWidth,h=tipEl.offsetHeight,vw=document.documentElement.clientWidth;
  var left=Math.min(Math.max(8,x-w/2),vw-w-8),top=y-h-14;if(top<8)top=y+18;
  tipEl.style.left=left+"px";tipEl.style.top=top+"px";
}
function tipHide(){tipEl.hidden=true;}
function cumAt(d,cx,cy){
  if(!CH)return;
  d=Math.max(1,Math.min(CH.last,d));
  var svg=$("#cumSvg");if(!svg)return;
  var xh=$("#cumXh"),hd=$("#cumHd");
  xh.setAttribute("x1",CH.X(d));xh.setAttribute("x2",CH.X(d));xh.setAttribute("visibility","visible");
  hd.setAttribute("cx",CH.X(d));hd.setAttribute("cy",CH.Y(CH.cum[d]));hd.setAttribute("visibility","visible");
  var r=svg.getBoundingClientRect(),px=r.left+CH.X(d)/CH.W*r.width,py=r.top+CH.Y(CH.cum[d])/CH.H*r.height;
  var rows=[[t("stCum"),CH.cum[d]]];
  if(CH.fx[d]>0)rows.push([t("stFixed"),CH.fx[d]]);
  if(CH.vr[d]>0)rows.push([t("stVari"),CH.vr[d]]);
  if(CH.budget>0)rows.push([t("stBudget"),Math.round(CH.budget)]);
  tipShow(px,py,t("dayN",{d:d}),rows);
  CH.i=d;
}
function cumHide(){var xh=$("#cumXh"),hd=$("#cumHd");if(xh)xh.setAttribute("visibility","hidden");if(hd)hd.setAttribute("visibility","hidden");tipHide();}
document.addEventListener("pointermove",function(e){
  var hit=e.target.closest&&e.target.closest("#cumHit");
  if(hit&&CH){
    var svg=$("#cumSvg"),r=svg.getBoundingClientRect(),rel=(e.clientX-r.left)/r.width*CH.W;
    cumAt(Math.round((rel-CH.pl)/CH.pw*(CH.D-1))+1);return;
  }
  if(CH&&$("#cumXh")&&$("#cumXh").getAttribute("visibility")==="visible"&&!(e.target.closest&&e.target.closest("#cumSvg")))cumHide();
  var el=e.target.closest&&e.target.closest("[data-tip]");
  if(el){try{var a=JSON.parse(el.getAttribute("data-tip"));tipShow(e.clientX,e.clientY,a[0],a[1]);}catch(x){}}
  else if(!hit)tipHide();
});
document.addEventListener("keydown",function(e){
  if(e.target&&e.target.id==="cumSvg"&&CH&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){
    e.preventDefault();cumAt((CH.i||CH.last)+(e.key==="ArrowRight"?1:-1));
  }
});
document.addEventListener("focusout",function(e){if(e.target&&e.target.id==="cumSvg")cumHide();});
